on:
  workflow_call:
    inputs:
      dir:
        type: string
        required: true
      tag:
        type: string
        required: true
      run_checks:
        type: boolean
        default: true

jobs:
  sast:
    if: inputs.run_checks
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (ERROR → currently non-blocking)
        continue-on-error: true          # TODO: remove to re-enable the gate
        run: semgrep scan --config auto --severity ERROR --error ${{ inputs.dir }}

  deps:
    if: inputs.run_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.dir }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  test:
    if: inputs.run_checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ inputs.dir }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: echo " python unit test part "
  build:
    needs: [sast, deps, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.dir }}:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.dir }}
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ inputs.dir }}
          cache-to: type=gha,scope=${{ inputs.dir }},mode=min

      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true          # TODO: remove to re-enable the gate
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - if: github.event_name != 'pull_request'
        run: docker push ${{ env.IMAGE }}