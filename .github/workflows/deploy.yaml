name: Deploy to GitOps

on:
  workflow_dispatch:
    inputs:
      frontend:
        description: "frontend tag: <tag> | latest | last_commit"
        type: string
        default: last_commit
      inventory:
        description: "inventory tag: <tag> | latest | last_commit"
        type: string
        default: last_commit
      notifications:
        description: "notifications tag: <tag> | latest | last_commit"
        type: string
        default: last_commit

permissions:
  contents: write 
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OWNER: mahmoudkhera
      PKG_PREFIX: grade-api-gitops
      REG: ghcr.io/mahmoudkhera/grade-api-gitops
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_KEY }}
          repositories: grade-api-gitops

      - uses: actions/checkout@v5
        with:
          repository: mahmoudkhera/grade-api-gitops
          token: ${{ steps.app.outputs.token }}
          path: helm_repo

      - name: resolve tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          IN_FRONTEND:      ${{ inputs.frontend }}
          IN_INVENTORY:     ${{ inputs.inventory }}
          IN_NOTIFICATIONS: ${{ inputs.notifications }}
        run: |
          last_commit() {   # $1 = package name
            curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$OWNER/packages/container/$PKG_PREFIX%2F$1/versions?per_page=30" \
            | jq -r '[ .[] | .metadata.container.tags[]
                        | select(test("^sha256-[0-9a-f]{64}\\.(sig|att|sbom)$") | not)
                        | select(. != "staging" and . != "latest" and . != "bootstrap") ] | first // empty'
          }
          resolve() {   # $1=output name  $2=package name  $3=input
            case "$3" in last_commit) t=$(last_commit "$2") ;; *) t="$3" ;; esac
            [ -n "$t" ] || { echo "::error::could not resolve tag for $2"; exit 1; }
            echo "$1=$t" >> "$GITHUB_OUTPUT"
            echo "$1 ($2) -> $t"
          }
          resolve frontend      frontend              "$IN_FRONTEND"
          resolve inventory     inventory-service     "$IN_INVENTORY"
          resolve notifications notifications-service "$IN_NOTIFICATIONS"

      - name: update values.yaml with yq
        working-directory: helm_repo/helm_chart
        env:
          FT: ${{ steps.tags.outputs.frontend }}
          IT: ${{ steps.tags.outputs.inventory }}
          NT: ${{ steps.tags.outputs.notifications }}
        run: |
          yq -i '
            .frontend.image.repository      = strenv(REG) + "/frontend"              |
            .frontend.image.tag             = strenv(FT)                             |
            .inventory.image.repository     = strenv(REG) + "/inventory-service"     |
            .inventory.image.tag            = strenv(IT)                             |
            .notifications.image.repository = strenv(REG) + "/notifications-service" |
            .notifications.image.tag        = strenv(NT)
          ' values.yaml
          git diff

      - name: commit and push
        working-directory: helm_repo
        env:
          FT: ${{ steps.tags.outputs.frontend }}
          IT: ${{ steps.tags.outputs.inventory }}
          NT: ${{ steps.tags.outputs.notifications }}
        run: |
          git config user.name  "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add helm_chart/values.yaml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "deploy: frontend=$FT inventory=$IT notifications=$NT"
          git push