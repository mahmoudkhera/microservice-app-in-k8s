name: Build & Push with Version

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        required: true
        default: full
        options:
          - full          # sast + deps + test → build
          - build-only    # skip checks, build + image scan only
      tag:
        description: "Image tag"
        type: choice
        required: true
        default: latest
        options:
          - latest        # moving tag
          - commit        # short SHA of the commit being built
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'inventory-service/**'
      - 'notifications-service/**'
  pull_request:

permissions:
  contents: read
  pull-requests: read
  packages: write

    
jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            # on PRs github.sha is a synthetic merge commit; use the real head
            sha="${{ github.event.pull_request.head.sha || github.sha }}"
            echo "tag=${sha::7}" >> "$GITHUB_OUTPUT"
          fi

  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend:      ${{ steps.filter.outputs.frontend }}
      inventory:     ${{ steps.filter.outputs.inventory }}
      notifications: ${{ steps.filter.outputs.notifications }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref_name }}  
          filters: |
            frontend:
              - 'frontend/**'
            inventory:
              - 'inventory-service/**'
            notifications:
              - 'notifications-service/**'

  frontend:
    needs: [meta, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/node-service.yml
    with:
      dir: frontend
      tag: ${{ needs.meta.outputs.tag }}
      run_checks: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}

  inventory:
    needs: [meta, changes]
    if: needs.changes.outputs.inventory == 'true'
    uses: ./.github/workflows/node-service.yml
    with:
      dir: inventory-service
      tag: ${{ needs.meta.outputs.tag }}
      run_checks: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}

  notifications:
    needs: [meta, changes]
    if: needs.changes.outputs.notifications == 'true'
    uses: ./.github/workflows/python-service.yml
    with:
      dir: notifications-service
      tag: ${{ needs.meta.outputs.tag }}
      run_checks: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
  

  integration:
    needs: [meta, changes, frontend, inventory, notifications]
    if: >-
      github.event_name != 'pull_request' &&
      !cancelled() &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      REG: ghcr.io/${{ github.repository }}
      TAG: ${{ needs.meta.outputs.tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      VERSION: ${{ github.sha }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      ALERT_RECIPIENT: ${{ vars.ALERT_RECIPIENT }}
      
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # unchanged services weren't rebuilt this run → fall back to last updated image
      - id: images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE_TAG: ${{ inputs.tag || 'commit' }}      # push/PR runs have no input → behave like "commit"
        run: |
          REPO=${GITHUB_REPOSITORY##*/}

          last_tag() {
            curl -sf \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$GITHUB_REPOSITORY_OWNER/packages/container/$REPO%2F$1/versions?per_page=10" \
            | jq -r '.[0].metadata.container.tags[0]'
          }

          fallback() {
            if [ "$MODE_TAG" = "latest" ]; then
              echo "[fallback] $1 → latest (MODE_TAG=latest)" >&2
              echo "latest"
            else
              t=$(last_tag "$1")
              echo "[fallback] $1 → '$t'" >&2
              echo "$t"
            fi
          }

          pick() { [ "$1" = "true" ] && echo "$REG/$2:$TAG" || echo "$REG/$2:$(fallback "$2")"; }

          echo "frontend=$(pick '${{ needs.changes.outputs.frontend }}' frontend)"                        >> "$GITHUB_OUTPUT"
          echo "inventory=$(pick '${{ needs.changes.outputs.inventory }}' inventory-service)"             >> "$GITHUB_OUTPUT"
          echo "notifications=$(pick '${{ needs.changes.outputs.notifications }}' notifications-service)" >> "$GITHUB_OUTPUT"
      # one env file, read by every compose invocation below

      - name: Pull images and start services
        env:
          FRONTEND_IMAGE:      ${{ steps.images.outputs.frontend }}
          INVENTORY_IMAGE:     ${{ steps.images.outputs.inventory }}
          NOTIFICATIONS_IMAGE: ${{ steps.images.outputs.notifications }}
        run: |
          docker pull "$FRONTEND_IMAGE"
          docker pull "$INVENTORY_IMAGE"
          docker pull "$NOTIFICATIONS_IMAGE"
          docker compose -f tests/docker-compose.yaml up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services..."
          for i in {1..20}; do
            frontend=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/        || true)
            inventory=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            notifications=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3002/health || true)

            echo "Attempt $i: frontend=$frontend inventory=$inventory notifications=$notifications"

            if [ "$frontend" = "200" ] && [ "$inventory" = "200" ] && [ "$notifications" = "200" ]; then
              echo "All services responding"
              exit 0
            fi
            sleep 2
          done
          echo "::error::services did not become healthy in time"
          exit 1

      - name: Run integration tests
        run: bash ./tests/integration-tests.sh

      - name: Show container logs on failure
        env:
          FRONTEND_IMAGE:      ${{ steps.images.outputs.frontend }}
          INVENTORY_IMAGE:     ${{ steps.images.outputs.inventory }}
          NOTIFICATIONS_IMAGE: ${{ steps.images.outputs.notifications }}
        if: failure()
        run: docker compose -f tests/docker-compose.yaml logs --no-color

      - name: Tear down
        env:
          FRONTEND_IMAGE:      ${{ steps.images.outputs.frontend }}
          INVENTORY_IMAGE:     ${{ steps.images.outputs.inventory }}
          NOTIFICATIONS_IMAGE: ${{ steps.images.outputs.notifications }}
        if: always()
        run: docker compose -f tests/docker-compose.yaml down -v
        
 