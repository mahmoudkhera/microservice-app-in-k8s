name: Build & Push with Version

on:
  workflow_dispatch:
    inputs:
      frontend_tag:
        description: "Frontend image tag "
        required: true
        type: choice
        options:
          - latest       
          - commited 
      inventory_tag:
        description: "Inventory image tag "
        required: true
        type: choice
        options:
          - latest       
          - commited 
      notifications_tag:
        description: "notifications image tag "
        required: true
        type: choice
        options:
          - latest       
          - commited 
  push:
    branches: [main]
    paths:
    - 'frontend/**'
    - 'inventory-service/**'
    - 'notifications-service/**'
  pull_request:


    
jobs:
  detect-changes:
    if: github.event_name == 'push' 
      
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            inventory:
              - 'inventory-service/**'
            notifications:
              - 'notifications-service/**'
      - name: build matrix
        id : set-matrix 
        run: |
          services=()
          [[ "${{steps.filter.outputs.frontend}}"== "true" ]] && service+('"frontend"')
          [[ "${{ steps.filter.outputs.inventory }}" == "true" ]]     && services+=('"inventory-service"')
          [[ "${{ steps.filter.outputs.notifications }}" == "true" ]] && services+=('"notifications-service"')

          json="[$(IFS=,; echo "${services[*]}")]"
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "Matrix: $json"
        


  
  vulnerability-scanning:
      needs: detect-changes
      runs-on: ubuntu-latest
      strategy:
        matrix:
          service: ${{ fromJson(needs.detect-changes.outputs.services)}}
      
      steps:
        - uses: actions/checkout@v4
        - name: Scan ${{ matrix.service }}
          uses: sonarsource/sonarqube-scan-action@master
          with:
            projectBaseDir: ${{ matrix.service }}
            args: >
              -Dsonar.organization=mahmoudkhera
              -Dsonar.projectKey=mahmoudkhera_${{ matrix.service }}
              -Dsonar.sources=.
              -Dsonar.host.url=https://sonarcloud.io
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  
  build-frontend:
    needs: [detect-changes, vulnerability-scanning]
    if: |
      !cancelled() && (            
       ( needs.detect-changes.result == 'success' &&
        contains(fromJson(needs.detect-changes.outputs.services), 'frontend') ) ||  
        github.event.inputs.frontend_tag != ''                       
      )
    runs-on: ubuntu-latest
    outputs:
     frontend_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine image tag
        id: set-tag
        run: |
          if [ "${{ github.event.inputs.frontend_tag}}" = "latest" ]; then
            TAG="${{ github.event.inputs.frontend_tag }}"
            echo "Using manual tag: $TAG"
          else
            TAG="${{ github.sha }}"
            echo "Using commit SHA: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops2-frontend:${{ steps.set-tag.outputs.tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/devops2-frontend:buildcache


  build-inventory:
    needs: [detect-changes, vulnerability-scanning]
    if: |
      !cancelled() && (            
       ( needs.detect-changes.result == 'success' &&
        contains(fromJson(needs.detect-changes.outputs.services), 'inventory-service') ) ||  
        github.event.inputs.frontend_tag != ''                       
      )
    runs-on: ubuntu-latest
    outputs:
     inventory_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine image tag
        id: set-tag
        run: |
          if [ "${{ github.event.inputs.inventory_tag}}" = "latest" ]; then
            TAG="${{ github.event.inputs.inventory_tag }}"
            echo "Using manual tag: $TAG"
          else
            TAG="${{ github.sha }}"
            echo "Using commit SHA: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./inventory-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops2-inventory:${{ steps.set-tag.outputs.tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/inventory-service:buildcache
          
  

  
  
  build-notifications:
    needs: [detect-changes, vulnerability-scanning]
    if: |
      !cancelled() && (            
       ( needs.detect-changes.result == 'success' &&
        contains(fromJson(needs.detect-changes.outputs.services), 'notifications-service') ) ||  
        github.event.inputs.frontend_tag != ''                       
      )
    runs-on: ubuntu-latest
    outputs:
     notifications_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine image tag
        id: set-tag
        run: |
          if [ "${{ github.event.inputs.notifications_tag}}" = "latest" ]; then
            TAG="${{ github.event.inputs.notifications_tag }}"
            echo "Using manual tag: $TAG"
          else
            TAG="${{ github.sha }}"
            echo "Using commit SHA: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./notifications-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops2-notifications:${{ steps.set-tag.outputs.tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/devops2-notifications:buildcache
          

 
 
 
  integration-test:
      
      name: Integration Test
      needs: [build-frontend, build-inventory, build-notifications]
      if: |
        always() &&
        !failure() &&
        (needs.build-frontend.result == 'success' ||
        needs.build-inventory.result == 'success' ||
        needs.build-notifications.result == 'success')
      runs-on: ubuntu-latest
      environment: 'dev-env'
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        VERSION: ${{ github.sha }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        SMTP_HOST: ${{ vars.SMTP_HOST }}
        SMTP_PORT: ${{ vars.SMTP_PORT }}
        SMTP_FROM: ${{ vars.SMTP_FROM }}
        ALERT_RECIPIENT: ${{ vars.ALERT_RECIPIENT }}
  
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Debug env variables
          run: |
            echo "DOCKER_USERNAME=$DOCKER_USERNAME"
            echo "VERSION=$VERSION"
            echo "SMTP_HOST=$SMTP_HOST"
            echo "SMTP_PORT=$SMTP_PORT"
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASS }}
    
        - name: Set image versions
          run: |
           # If service was just built this run, use current SHA
           # Otherwise read the last SHA that was successfully built
            if [ "${{ github.event.inputs.frontend_tag }}" == "latest" ]; then
                 FRONTEND_VERSION="latest"
            else
                 FRONTEND_VERSION=$(curl -s "https://hub.docker.com/v2/repositories/mahmoudkhera/devops2-frontend/tags?page_size=1&ordering=last_updated"   | jq -r '.results[0].name')
            fi

             if [ "${{ github.event.inputs.inventory_tag}}" = "latest" ]; then
              BACKEND_VERSION="latest"
            else
              BACKEND_VERSION=$(curl -s "https://hub.docker.com/v2/repositories/mahmoudkhera/devops2-inventory/tags?page_size=1&ordering=last_updated"   | jq -r '.results[0].name')
            fi

             if [ "${{ github.event.inputs.notifications_tag}}" = "latest" ]; then
               notifications_VERSION="latest"
            else
              notifications_VERSION=$(curl -s "https://hub.docker.com/v2/repositories/mahmoudkhera/devops2-notifications/tags?page_size=1&ordering=last_updated"   | jq -r '.results[0].name')
            fi

            echo "FRONTEND_VERSION=$FRONTEND_VERSION"         >> $GITHUB_ENV
            echo "BACKEND_VERSION=$BACKEND_VERSION"           >> $GITHUB_ENV
            echo "NOTIFICATIONS_VERSION=$notifications_VERSION" >> $GITHUB_ENV

            echo "Frontend  → $FRONTEND_VERSION"
            echo "Backend   → $BACKEND_VERSION"
            echo "notifications → $NOTIFICATIONS_VERSION"


        - name: Pull images
          run: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/devops2-frontend:${FRONTEND_VERSION}
            docker pull ${{ secrets.DOCKER_USERNAME }}/devops2-inventory:${BACKEND_VERSION}
            docker pull ${{ secrets.DOCKER_USERNAME }}/devops2-notifications:${NOTIFICATIONS_VERSION}
      
        - name: Start services with docker compose
          run: docker compose -f tests/docker-compose.yaml up -d
  
        - name: Wait for services to be ready
          run: |
           echo "Waiting for services..."
           for i in {1..20}; do
              inventory=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
              NOITICATION=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3002/health || true)
              FRONTEND=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || true)
        
              echo "Attempt $i:"
              echo "  frontend: $FRONTEND"
              echo "  inventory:  $inventory"
              echo "  notifications: $NOITICATION"
        
              if [ "$FRONTEND" = "200" ] && [ "$inventory" = "200" ] && [ "$NOITICATION" = "200" ]; then
                echo " All services responding"
                break
              fi
        
              sleep 2
            done
  
        - name: Run integration tests
          run: bash ./tests/integration-tests.sh
  
        - name: Dump logs on failure        
          if: failure()
          run: |
            echo "═══ FRONTEND LOGS ═══"
            docker logs ci-frontend || true
            echo "═══ INVENTORY LOGS ═══"
            docker logs ci-inventory || true
            echo "═══ notifications LOGS ═══"
            docker logs ci-notifications || true  
  
        - name: Cleanup
          if: always()
          run: docker compose -f tests/docker-compose.yaml down -v 

