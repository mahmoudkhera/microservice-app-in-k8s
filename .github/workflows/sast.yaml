name: sast
on:
  workflow_call:
    inputs:
      dir:
        type: string
        required: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: Semgrep (ERROR → currently non-blocking)
        continue-on-error: true          # TODO: remove to re-enable the gate
        run: semgrep scan --config auto --severity ERROR --error ${{ inputs.dir }}