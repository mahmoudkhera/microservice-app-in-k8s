---
# Source: app/templates/frontend.yaml
kind: ConfigMap
apiVersion: v1
metadata:
  name: frontend-config
  namespace: app-prod
  labels:
    app.kubernetes.io/version: "1.16.0"
    helm.sh/chart: app-0.1.0
data:
  API: "/backend"
  FRONTEND_HOST: "0.0.0.0"
  FRONTEND_PORT: "8000"
---
# Source: app/templates/frontend.yaml
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: app-prod
  labels:
    app.kubernetes.io/version: "1.16.0"
    helm.sh/chart: app-0.1.0
    app: frontend
    app.kubernetes.io/name: frontend
    tier: frontend
spec:
  type: ClusterIP
  ports:
    # The ingress references this port by name.
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: frontend
    app.kubernetes.io/name: frontend
    tier: frontend
---
# Source: app/templates/frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app-prod
  labels:
    app.kubernetes.io/version: "1.16.0"
    helm.sh/chart: app-0.1.0
    app: frontend
    app.kubernetes.io/name: frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      app.kubernetes.io/name: frontend
      tier: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/version: "1.16.0"
        helm.sh/chart: app-0.1.0
        app: frontend
        app.kubernetes.io/name: frontend
        tier: frontend
      annotations:
        # Roll the pods when the ConfigMap changes - envFrom alone would not.
        checksum/config: ebe710dc936fd27ae705701ecb499281f36660977c625398e51312102d91cf2b
    spec:
      containers:
        - name: frontend
          image: "registry.gitlab.com/mahmoudkhera20/microservice-devops/frontend:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 16Mi
