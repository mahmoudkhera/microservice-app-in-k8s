

nameOverride: ""
fullnameOverride: ""

namespace:
  # Set to false when the namespace is managed elsewhere (terraform, argocd...).
  create: true
  name: test


image:
  # Per-service image.pullPolicy overrides this.
  pullPolicy: IfNotPresent
  # Names of pre-created docker-registry secrets, e.g. [{name: gitlab-registry}].
  # Required if the GitLab registry project is private.
  pullSecrets: []

# Pod-level security context shared by every service.
podSecurityContext: {}
# Container-level security context shared by every service.
securityContext: {}


# frontend
frontend:
  enabled: true
  # Deployment and Service name. Also the in-cluster DNS name, so changing it
  name: frontend
  replicas: 1
  image:
    repository: registry.gitlab.com/mahmoudkhera20/microservice-devops/frontend
    tag: latest
    pullPolicy: ""
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
    # Only used when type is NodePort; leave null to let k8s pick (30000-32767).
    nodePort: null
    annotations: {}

  config:
    FRONTEND_HOST: 0.0.0.0
    FRONTEND_PORT: 8000
    # The browser calls this, so it has to be reachable from outside the
    # cluster. With the ingress below, /backend on the ALB hostname routes to
    # the inventory service - a relative path works and needs no rebuild.
    API: /backend
  resources:
    requests:
      memory: 16Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
  # Probes are passed through verbatim. Set to {} to disable.
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}


# inventory
inventory:
  enabled: true
  name: inventory
  replicas: 1
  image:
    repository: registry.gitlab.com/mahmoudkhera20/microservice-devops/inventory-service
    tag: 20260726211815-b9d2f677
    pullPolicy: ""
  containerPort: 3001
  service:
    type: ClusterIP
    port: 3001
    nodePort: null
    annotations: {}
  config:
    HOST: 0.0.0.0
    PORT: 3001
    CORS_ORIGIN: "*"
    NOTIFICATION_URL: http://notifications:3002/notify
    ALERT_RECIPIENT: mkmahmoud944@gmail.com
  # Encrypted with kubeseal --scope cluster-wide (see generate_secret.sh), so
  # the ciphertext survives a rename of the secret or the namespace.
  sealedSecret:
    enabled: true
    name: database-secrets
    clusterWide: true
    encryptedData:
      DATABASE_URL: 
  resources:
    requests:
      memory: 16Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []



# notifications
notifications:
  enabled: true
  name: notifications
  replicas: 1
  image:
    repository: registry.gitlab.com/mahmoudkhera20/microservice-devops/notifications-service
    tag: latest
    pullPolicy: ""
  containerPort: 3002
  service:
    type: ClusterIP
    port: 3002
    nodePort: null
    annotations: {}
  config:
    HOST: 0.0.0.0
    PORT: 3002
    SMTP_PORT: 587
    SMTP_FROM: mahmoudkhera20@gmail.com
  sealedSecret:
    enabled: true
    name: smtp-secrets
    clusterWide: true
    encryptedData:
      SMTP_HOST: 
      SMTP_USER: 
      SMTP_PASSWORD: 
  resources:
    requests:
      memory: 16Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
  # No known health endpoint on this service, so no probes.
  readinessProbe: {}
  livenessProbe: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}




# ingress - one ALB in front of frontend and inventory
ingress:
  enabled: true
  name: app-ingress
  className: nginx
  # Leave empty to serve on the ALB's own DNS name with no host rule.
  host: ""
  # Share one ALB with the grafana ingress in the logging chart.
  groupName: stockwatch
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

  #   alb.ingress.kubernetes.io/scheme: internet-facing
  #   alb.ingress.kubernetes.io/target-type: ip
  #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  #   # ALB health checks are set per ingress, not per backend: every service
  #   # behind this one must answer 200 on this path or its targets go unhealthy.
  #   alb.ingress.kubernetes.io/healthcheck-path: /healthz
  # # Evaluated in order, so the longest prefix goes first.
  backendPath: /backend
  frontendPath: /
  pathType: Prefix