{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name | default (include "stockwatch.fullname" .) }}
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.ingress.groupName }}
    alb.ingress.kubernetes.io/group.name: {{ . }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    -
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- if .Values.inventory.enabled }}
          - path: {{ .Values.ingress.backendPath }}
            pathType: {{ .Values.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Values.inventory.name }}
                port:
                  name: http
          {{- end }}
          {{- if .Values.frontend.enabled }}
          - path: {{ .Values.ingress.frontendPath }}
            pathType: {{ .Values.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Values.frontend.name }}
                port:
                  name: http
          {{- end }}
          {{- if not (or .Values.frontend.enabled .Values.inventory.enabled) }}
          {{- fail "ingress.enabled is true but neither frontend nor inventory is enabled" }}
          {{- end }}
{{- end }}
