services:
  inventory:
    image: ${INVENTORY_IMAGE}
    container_name: inventory
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-sqlite::memory:}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8000}
      - NOTIFICATION_URL=http://notification:3002/notify
      - ALERT_RECIPIENT=${ALERT_RECIPIENT:-test@example.com}
    networks:
      - stockwatch-net

  notification:
    image: ${NOTIFICATIONS_IMAGE}
    container_name: notification
    ports:
      - "3002:3002"
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@example.com}
    networks:
      - stockwatch-net

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: frontend
    ports:
      - "8000:8000"
    environment:
      - FRONTEND_PORT=8000
      - FRONTEND_HOST=0.0.0.0
      - API=${API:-http://localhost:3000}
    depends_on:
      inventory:
        condition: service_healthy
      notification:
        condition: service_healthy
    networks:
      - stockwatch-net

networks:
  stockwatch-net:
    driver: bridge